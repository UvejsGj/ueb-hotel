<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Dhomat</title>
</head>
<body>
<main>
    <h1>Dhomat</h1>

    <p sec:authorize="hasRole('ADMIN')"><a class="btn" th:href="@{/admin/rooms/new}">Dhomë e re</a></p>

    <p th:if="${#lists.isEmpty(rooms)}">Nuk ka dhoma.</p>

    <table class="table" th:unless="${#lists.isEmpty(rooms)}">
        <thead>
        <tr>
            <th>Numri</th>
            <th>Tipi</th>
            <th>Kati</th>
            <th>Kapaciteti</th>
            <th>Çmimi për natë</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rooms}">
            <td><a th:href="@{/app/rooms/{id}(id=${r.id})}" th:text="${r.number}">101</a></td>
            <td th:text="${r.type}">SINGLE</td>
            <td th:text="${r.floor}">1</td>
            <td th:text="${r.capacity}">1</td>
            <td th:text="${#numbers.formatDecimal(r.pricePerNight, 1, 'POINT', 2, 'COMMA')} + ' €'">30,00 €</td>
            <td>
                <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/admin/rooms/{id}/edit(id=${r.id})}">Ndrysho</a>
                <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/admin/rooms/{id}/delete(id=${r.id})}">
                    <button type="submit" class="btn btn-danger">Fshij</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
