<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Dhoma</title>
</head>
<body>
<main>
    <h1 th:text="${room.id == null} ? 'Dhomë e re' : 'Ndrysho dhomën'">Dhomë e re</h1>

    <form method="post" th:object="${room}"
          th:action="${room.id == null} ? @{/admin/rooms/new} : @{/admin/rooms/{id}/edit(id=${room.id})}">

        <div class="form-row">
            <label for="number">Numri i dhomës</label>
            <input type="text" th:field="*{number}">
            <p class="error" th:if="${#fields.hasErrors('number')}" th:errors="*{number}"></p>
        </div>

        <div class="form-row">
            <label for="type">Tipi</label>
            <select th:field="*{type}">
                <option value="">-- zgjidhni --</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}">SINGLE</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
        </div>

        <div class="form-row">
            <label for="floor">Kati</label>
            <input type="number" min="0" max="20" th:field="*{floor}">
            <p class="error" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></p>
        </div>

        <div class="form-row">
            <label for="capacity">Kapaciteti (veta)</label>
            <input type="number" min="1" max="6" th:field="*{capacity}">
            <p class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
        </div>

        <div class="form-row">
            <label for="pricePerNight">Çmimi për natë (€)</label>
            <input type="number" min="0.01" step="0.01" th:field="*{pricePerNight}">
            <p class="error" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></p>
        </div>

        <div class="form-row">
            <button type="submit" class="btn">Ruaj</button>
            <a th:href="@{/app/rooms}">Anulo</a>
        </div>
    </form>
</main>
</body>
</html>
