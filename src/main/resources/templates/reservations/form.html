<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Rezervimi</title>
</head>
<body>
<main>
    <h1 th:text="${reservation.id == null} ? 'Rezervim i ri' : 'Ndrysho rezervimin'">Rezervim i ri</h1>

    <form method="post" th:object="${reservation}"
          th:action="${reservation.id == null} ? @{/app/reservations/new} : @{/app/reservations/{id}/edit(id=${reservation.id})}">

        <div class="form-row">
            <label for="guestName">Emri i mysafirit</label>
            <input type="text" th:field="*{guestName}">
            <p class="error" th:if="${#fields.hasErrors('guestName')}" th:errors="*{guestName}"></p>
        </div>

        <div class="form-row">
            <label for="guestEmail">E-mail</label>
            <input type="email" th:field="*{guestEmail}">
            <p class="error" th:if="${#fields.hasErrors('guestEmail')}" th:errors="*{guestEmail}"></p>
        </div>

        <div class="form-row">
            <label for="checkIn">Data e hyrjes</label>
            <input type="date" th:field="*{checkIn}">
            <p class="error" th:if="${#fields.hasErrors('checkIn')}" th:errors="*{checkIn}"></p>
        </div>

        <div class="form-row">
            <label for="checkOut">Data e daljes</label>
            <input type="date" th:field="*{checkOut}">
            <p class="error" th:if="${#fields.hasErrors('checkOut')}" th:errors="*{checkOut}"></p>
            <p class="error" th:if="${#fields.hasErrors('checkOutAfterCheckIn')}" th:errors="*{checkOutAfterCheckIn}"></p>
        </div>

        <div class="form-row">
            <label for="guests">Numri i mysafirëve</label>
            <input type="number" min="1" max="6" th:field="*{guests}">
            <p class="error" th:if="${#fields.hasErrors('guests')}" th:errors="*{guests}"></p>
        </div>

        <div class="form-row">
            <label for="room">Dhoma</label>
            <select id="room" name="room">
                <option value="">-- zgjidhni --</option>
                <option th:each="r : ${rooms}"
                        th:value="${r.id}"
                        th:selected="${reservation.room != null and reservation.room.id == r.id}"
                        th:text="${r.number + ' (' + r.type + ', ' + r.capacity + ' veta)'}">101 (SINGLE, 1 veta)</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('room')}" th:errors="*{room}"></p>
        </div>

        <div class="form-row">
            <button type="submit" class="btn">Ruaj</button>
            <a th:href="@{/app/reservations}">Anulo</a>
        </div>
    </form>
</main>
</body>
</html>
